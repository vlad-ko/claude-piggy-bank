name: Tests

# The repo's branch protection requires a PR but, until this workflow existed,
# required no check — so a PR could merge with the suite failing or never run.
# Protection without a check guarantees the shape of a change, not its
# correctness.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Every version reports. A green 3.13 beside a red 3.11 is the useful
      # signal -- fail-fast would hide which versions are actually supported.
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show interpreter
        # Also prints the SQLite this runner links and the verdict CPB's own
        # capability check reaches on it (#30). The v7 -> v8 upgrade drops a
        # column IN PLACE on SQLite 3.35+ and falls back to a full rebuild
        # below that; both paths are correct, so this does not gate the build.
        # It is printed per matrix leg because "the runners have a new enough
        # SQLite" is an observation about the runners, and a developer laptop
        # is not evidence for it.
        run: |
          python -VV
          python -c "import sqlite3, ingest; print('sqlite_version', sqlite3.sqlite_version, '| drop_column_supported', ingest._sqlite_supports_drop_column())"

      - name: Run the suite
        # No pip install, deliberately: see stdlib-only below.
        run: python -m unittest discover -s tests -v

  stdlib-only:
    # "Python 3 standard library only. No pip installs, no Node, no build step"
    # is the project's first stated design rule (README, CONTRIBUTING) and
    # nothing enforced it. A single `import requests` would break the promise
    # that this runs anywhere with a Python 3, and would be caught only by a
    # reader who happened to know the rule.
    name: stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every import must resolve against a bare interpreter
        # Checks the modules the project actually ships. A third-party import
        # fails here with ModuleNotFoundError on an interpreter that has had
        # nothing installed into it -- which is precisely the claim under test.
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib, sys, sysconfig

          # Modules this project defines itself; everything else must be stdlib.
          local = {p.stem for p in pathlib.Path(".").glob("*.py")}
          local |= {p.stem for p in pathlib.Path("tests").glob("*.py")}

          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if ".git" in path.parts:
                  continue
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      # A relative import (level > 0) is by definition local.
                      if node.level:
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name not in local:
                          offenders.append(f"{path}: {name}")

          if offenders:
              print("Non-stdlib imports found -- the README promises none:")
              for line in offenders:
                  print(f"  {line}")
              sys.exit(1)
          print(f"All imports resolve to the standard library or to this repo "
                f"({len(local)} local modules).")
          PY

      - name: No manifest may declare a dependency
        # NARROWED from "no manifest may exist" (#21). The rule being enforced
        # is a property -- CPB installs nothing into the user's environment but
        # CPB -- and the step above already tests that property directly, by
        # resolving every import in every shipped module against
        # `sys.stdlib_module_names` on an interpreter with nothing installed.
        # Banning `pyproject.toml` by filename tested a proxy: it failed a file
        # with `dependencies = []`, which declares exactly the thing the rule
        # wants, and so foreclosed packaging options that satisfy it
        # completely. This step is now the second, cheaper signal -- about
        # INTENT, which the import scanner cannot see: a declared dependency is
        # someone planning an install step, even before the import lands.
        #
        # Two tiers, both deliberate:
        #
        #   Rejected on sight. `requirements*.txt`, `Pipfile` and the lockfiles
        #   exist only to drive an installer -- declaring nothing in one is a
        #   file with no purpose -- and the npm manifests additionally imply a
        #   Node runtime, which the project rules out outright rather than
        #   conditionally. `setup.py` and `setup.cfg` are superseded by
        #   `pyproject.toml`, so permitting a dependency-free variant of them
        #   buys nothing and adds an executable manifest to audit.
        #
        #   Inspected. `pyproject.toml` passes iff it declares no runtime,
        #   optional or grouped dependency. `build-system.requires` is NOT
        #   counted: a build frontend provisions it in an isolated environment
        #   that is discarded, so nothing reaches the environment the user
        #   installs into -- and anything it smuggled in would still have to
        #   be imported to matter, where the step above catches it.
        #
        # `dynamic = ["dependencies"]` fails: it moves the declaration
        # somewhere this cannot read, and a check that cannot see its answer
        # must refuse rather than report a clean one.
        #
        # Adding such a file is still a reviewed decision -- this step only
        # stops it from being an automatic build break. Needs tomllib (3.11+);
        # on an older interpreter this step fails loudly rather than passing.
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, tomllib

          REJECTED_ON_SIGHT = {
              "Pipfile", "Pipfile.lock", "poetry.lock", "uv.lock",
              "package.json", "package-lock.json", "yarn.lock",
              "pnpm-lock.yaml", "setup.py", "setup.cfg",
          }

          def declared_dependencies(data):
              """Every dependency `pyproject.toml` declares, as "where: what"."""
              found = []
              project = data.get("project", {})
              found += [f"project.dependencies: {d}" for d in project.get("dependencies", [])]
              for extra, deps in project.get("optional-dependencies", {}).items():
                  found += [f"project.optional-dependencies.{extra}: {d}" for d in deps]
              for group, deps in data.get("dependency-groups", {}).items():
                  found += [f"dependency-groups.{group}: {d}" for d in deps]
              poetry = data.get("tool", {}).get("poetry", {})
              found += [
                  f"tool.poetry.dependencies: {name}"
                  for name in poetry.get("dependencies", {})
                  if name != "python"
              ]
              for group, spec in poetry.get("group", {}).items():
                  found += [
                      f"tool.poetry.group.{group}.dependencies: {name}"
                      for name in spec.get("dependencies", {})
                      if name != "python"
                  ]
              if "dependencies" in project.get("dynamic", []):
                  found.append("project.dynamic: dependencies are declared elsewhere")
              return found

          offenders = []
          inspected = []
          for path in sorted(pathlib.Path(".").rglob("*")):
              if ".git" in path.parts or not path.is_file():
                  continue
              name = path.name
              if name in REJECTED_ON_SIGHT or (
                  name.startswith("requirements") and name.endswith(".txt")
              ):
                  offenders.append(f"{path}: rejected on sight -- it exists to drive an installer")
                  continue
              if name != "pyproject.toml":
                  continue
              inspected.append(str(path))
              try:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
              except (tomllib.TOMLDecodeError, UnicodeDecodeError) as exc:
                  offenders.append(f"{path}: unreadable, so its dependencies are unknown ({exc})")
                  continue
              offenders += [f"{path} declares {d}" for d in declared_dependencies(data)]

          if offenders:
              print("Dependency declaration(s) found, contradicting stdlib-only:")
              for line in offenders:
                  print(f"  {line}")
              sys.exit(1)
          print(
              "No manifest declares a dependency"
              f" ({len(inspected)} inspected: {', '.join(inspected) or 'none present'})."
          )
          PY

  # Fan-in. Branch protection requires THIS one check, so the matrix can grow
  # or shrink without anyone editing the protection settings -- and a matrix
  # leg that never ran cannot be mistaken for one that passed, because a
  # skipped or cancelled dependency is not `success`.
  suite:
    name: suite
    if: always()
    needs: [test, stdlib-only]
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded
        run: |
          set -euo pipefail
          echo "test        = ${{ needs.test.result }}"
          echo "stdlib-only = ${{ needs.stdlib-only.result }}"
          if [ "${{ needs.test.result }}" != "success" ] \
          || [ "${{ needs.stdlib-only.result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
